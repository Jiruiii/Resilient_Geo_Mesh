<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ResilientGeo 台灣離線地圖 UI 開發入口">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ResilientGeo">
  <title>ResilientGeo 台灣離線地圖</title>
  <style>
  </style>
</head>
<body>
  <!-- PMTiles is served locally so Chrome can exercise the same packaged data. -->
  <script src="pmtiles.js"></script>
  <script src="pmtiles_protocol.js"></script>
  <script src="nlsc_static_layers.js"></script>
  <script src="nlsc_government_feed.js"></script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    void (async () => {
      if (!('serviceWorker' in navigator)) return;

      try {
        await navigator.serviceWorker.ready;
        if (!navigator.serviceWorker.controller) {
          await new Promise((resolve) => {
            const onControllerChange = () => {
              navigator.serviceWorker.removeEventListener('controllerchange', onControllerChange);
              resolve();
            };
            navigator.serviceWorker.addEventListener('controllerchange', onControllerChange, { once: true });
            if (navigator.serviceWorker.controller) resolve();
          });
        }

        if (navigator.serviceWorker.controller && navigator.onLine) {
          const shellScripts = [...document.querySelectorAll('script[src]')]
            .map((script) => new URL(script.src, window.location.href))
            .filter((url) => url.origin === window.location.origin);
          await Promise.all([
            fetch(window.location.href),
            ...shellScripts.map((url) => fetch(url.href)),
          ]);
        }
      } catch (_) {
        // Keep the app usable if service workers or offline caching are unavailable.
      }
    })();
  </script>
</body>
</html>
